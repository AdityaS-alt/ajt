
<!DOCTYPE html>
<html>
<head>
    <title>Send Email</title>
</head>
<body>

    <h2>Java Mail API</h2>

    <form action="sendEmail" method="post">

        Receiver Email:
        <input type="email" name="to" required>
        <br><br>

        Subject:
        <input type="text" name="subject" required>
        <br><br>

        Message:
        <textarea name="body" required></textarea>
        <br><br>

        <input type="submit" value="Send Email">

    </form>

</body>
</html>
